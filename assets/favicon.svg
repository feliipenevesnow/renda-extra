<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(255, 215, 0, 0.25)" stroke-width="1.5"/>

  <!-- Shield Outer Border -->
  <path d="M32 10 L48 16 C48 30 42 43 32 52 C22 43 16 30 16 16 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Shield Inner Fill -->
  <path d="M32 14 L44 18.5 C44 29.5 39 39.5 32 47 C25 39.5 20 29.5 20 18.5 Z" 
        fill="url(#goldGrad)" 
        fill-opacity="0.18"/>

  <!-- Executive Star Emblem -->
  <polygon points="32,22 34.8,28.2 41.5,28.8 36.4,33.4 37.9,40 32,36.5 26.1,40 27.6,33.4 22.5,28.8 29.2,28.2" 
           fill="url(#goldGrad)" 
           stroke="#D97706" 
           stroke-width="0.5"/>
</svg>
